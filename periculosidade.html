<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periculosidade - AcquaSafe</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css">     <!-- seu css atual -->
    <link rel="stylesheet" href="style-dark.css"> <!-- novo css dark -->
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-700 text-white py-4 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">AquacSafe</h1>
            <div class="flex gap-8">
                <a href="solucoes.html" class="hover:text-blue-200 font-medium">Soluções</a>
                <a href="patogenos.html" class="hover:text-blue-200 font-medium">Patógenos</a>
                <a href="periculosidade.html" class="hover:text-blue-200 font-medium active">Periculosidade</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <header class="mb-10">
            <h2 class="text-4xl font-bold text-gray-800 mb-2">Níveis de Periculosidade</h2>
            <p class="text-gray-600">Classificação de risco e medidas de contenção</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Tabela principal -->
            <div class="bg-white rounded-2xl shadow overflow-hidden">
                <table class="w-full">
                    <thead class="bg-red-700 text-white">
                        <tr>
                            <th class="px-6 py-4 text-left">Nível</th>
                            <th class="px-6 py-4 text-left">Descrição</th>
                            <th class="px-6 py-4 text-left">Exemplo</th>
                            <th class="px-6 py-4 text-center">EPI Recomendado</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPerigo" class="text-gray-700"></tbody>
                </table>
            </div>

            <!-- Card de resumo -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <i class="fas fa-exclamation-triangle text-red-500"></i>
                        Legenda de Risco
                    </h3>
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 p-3 bg-red-50 rounded-xl">
                            <div class="w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center font-bold">4</div>
                            <div><strong>Alto Risco</strong> - Patógenos perigosos</div>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-orange-50 rounded-xl">
                            <div class="w-6 h-6 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold">3</div>
                            <div><strong>Risco Moderado</strong> - Agentes infecciosos</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const perigos = [
            { nivel: "BSL-1", desc: "Risco mínimo", exemplo: "Bactérias não patogênicas", epi: "Luvas, jaleco" },
            { nivel: "BSL-2", desc: "Risco moderado", exemplo: "E. coli patogênica", epi: "Luvas, jaleco, óculos" },
            { nivel: "BSL-3", desc: "Risco alto", exemplo: "Mycobacterium tuberculosis", epi: "Respirador N95, roupa completa" },
            { nivel: "BSL-4", desc: "Risco muito alto", exemplo: "Vírus Ebola", epi: "Traje positivo pressurizado" }
        ];

        function renderPerigos() {
            const tbody = document.getElementById('tabelaPerigo');
            tbody.innerHTML = perigos.map(p => `
                <tr class="border-t hover:bg-red-50">
                    <td class="px-6 py-4 font-bold text-red-700">${p.nivel}</td>
                    <td class="px-6 py-4">${p.desc}</td>
                    <td class="px-6 py-4">${p.exemplo}</td>
                    <td class="px-6 py-4 text-center text-sm">${p.epi}</td>
                </tr>
            `).join('');
        }

        window.onload = renderPerigos;
    </script>
</body>
</html>
