<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcquaSafe - Pagamento</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="pagamento.css">
</head>
<body class="h-full bg-[#0a0f1a] text-white overflow-auto font-sans">

  <div class="w-full min-h-full flex flex-col">
    <!-- Header -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-white/10 bg-[#0a0f1a]/95 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
          <i data-lucide="droplets" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-xl font-bold tracking-tight gradient-text">AcquaSafe</span>
      </div>
      <div class="flex items-center gap-2 text-sm text-emerald-400">
        <i data-lucide="shield-check" class="w-5 h-5"></i> 
        <span class="font-medium">Pagamento Seguro</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-10">
      <h1 class="text-3xl font-bold text-center mb-2">Finalizar Pagamento</h1>
      <p class="text-slate-400 text-center mb-12">Escolha seu plano e forma de pagamento</p>

      <div class="grid md:grid-cols-5 gap-8">
        <!-- Left Column -->
        <div class="md:col-span-3 space-y-8">

          <!-- Plans -->
          <section>
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Plano Selecionado</h2>
            <div class="grid gap-4" id="plans-container">
              <!-- Plans serão preenchidos via JS ou mantidos como estão -->
              <div class="plan-card selected" data-plan="pro" onclick="selectPlan(this)">
                <div class="flex justify-between items-start">
                  <div>
                    <span class="text-xs font-bold text-cyan-400">MAIS POPULAR</span>
                    <h3 class="text-xl font-bold mt-1">Plano Profissional</h3>
                    <p class="text-slate-400 text-sm mt-1">Monitoramento completo + alertas em tempo real</p>
                  </div>
                  <div class="text-right">
                    <span class="text-3xl font-bold text-cyan-400">R$ 89</span>
                    <span class="text-slate-400">/mês</span>
                  </div>
                </div>
              </div>

              <!-- Outros planos (mantidos simplificados) -->
              <div class="plan-card" data-plan="basic" onclick="selectPlan(this)">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="text-xl font-bold">Plano Básico</h3>
                    <p class="text-slate-400 text-sm mt-1">Monitoramento essencial</p>
                  </div>
                  <div class="text-right">
                    <span class="text-3xl font-bold">R$ 49</span>
                    <span class="text-slate-400">/mês</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Payment Methods + Card Image -->
          <section>
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Forma de Pagamento</h2>
            
            <!-- Payment Method Buttons -->
            <div class="grid grid-cols-3 gap-3 mb-6">
              <button class="payment-method active" data-method="card" onclick="selectMethod(this)">
                <i data-lucide="credit-card" class="w-6 h-6"></i>
                <span>Cartão</span>
              </button>
              <button class="payment-method" data-method="pix" onclick="selectMethod(this)">
                <i data-lucide="qr-code" class="w-6 h-6"></i>
                <span>PIX</span>
              </button>
              <button class="payment-method" data-method="boleto" onclick="selectMethod(this)">
                <i data-lucide="file-text" class="w-6 h-6"></i>
                <span>Boleto</span>
              </button>
            </div>

              <!-- Formulário do Cartão -->
              <div class="space-y-4">
                <input id="card-name" type="text" placeholder="Nome no cartão" 
                       class="input-field" oninput="updateCardDisplay()">
                <input id="card-number" type="text" placeholder="0000 0000 0000 0000" maxlength="19"
                       class="input-field" oninput="formatCard(this); updateCardDisplay()">
                <div class="grid grid-cols-2 gap-4">
                  <input id="card-exp" type="text" placeholder="MM/AA" maxlength="5"
                         class="input-field" oninput="formatExp(this); updateCardDisplay()">
                  <input id="card-cvv" type="text" placeholder="CVV" maxlength="4"
                         class="input-field">
                </div>
              </div>
            </div>

            <!-- PIX e Boleto (mantidos) -->
            <div id="form-pix" class="hidden">...</div>
            <div id="form-boleto" class="hidden">...</div>
          </section>
        </div>

        <!-- Right Column - Summary -->
        <aside class="md:col-span-2">
          <!-- Resumo mantido (pode melhorar depois) -->
        </aside>
      </div>
    </main>
  </div>

  <script src="pagamento.js"></script>
</body>
</html>
