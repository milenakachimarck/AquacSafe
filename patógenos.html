<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patógenos - AcquaSafe</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="style-dark.css">
</head>
<body class="h-full bg-[#0a0f1a] text-white overflow-auto">

    <nav class="py-5 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                    <i data-lucide="droplets" class="w-5 h-5 text-white"></i>
                </div>
                <span class="text-2xl font-bold gradient-text">AcquaSafe</span>
            </div>
            
            <div class="flex gap-8 text-sm">
                <a href="solucoes.html" class="hover:text-cyan-400 transition-colors">Soluções</a>
                <a href="patogenos.html" class="text-cyan-400 font-medium">Patógenos</a>
                <a href="periculosidade.html" class="hover:text-cyan-400 transition-colors">Periculosidade</a>
                <a href="index.html" class="text-red-400 hover:text-red-300">Sair</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-10">
        <header class="mb-10">
            <h2 class="text-4xl font-bold text-white mb-2">Patógenos</h2>
            <p class="text-slate-400">Cadastro e informações de agentes biológicos</p>
        </header>

        <div class="flex flex-wrap gap-4 mb-6">
            <input id="searchPat" type="text" placeholder="Buscar patógeno..." 
                   class="px-4 py-3 w-80 rounded-lg bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
        </div>

        <div class="glass-card rounded-2xl overflow-hidden">
            <table class="w-full">
                <thead>
                    <tr class="bg-white/5">
                        <th class="px-6 py-5 text-left">Patógeno</th>
                        <th class="px-6 py-5 text-left">Grupo de Risco</th>
                        <th class="px-6 py-5 text-left">Tipo</th>
                        <th class="px-6 py-5 text-left">Doença Associada</th>
                        <th class="px-6 py-5 text-center">Nível BSL</th>
                    </tr>
                </thead>
                <tbody id="tabelaPatogenos" class="text-slate-300"></tbody>
            </table>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const patogenos = [
            { nome: "Escherichia coli O157:H7", risco: "2", tipo: "Bactéria", doenca: "Colite hemorrágica", bsl: "BSL-2" },
            { nome: "Mycobacterium tuberculosis", risco: "3", tipo: "Bactéria", doenca: "Tuberculose", bsl: "BSL-3" },
            { nome: "SARS-CoV-2", risco: "3", tipo: "Vírus", doenca: "COVID-19", bsl: "BSL-3" },
            { nome: "Candida albicans", risco: "2", tipo: "Fungo", doenca: "Candidíase", bsl: "BSL-2" },
            { nome: "Plasmodium falciparum", risco: "3", tipo: "Protozoário", doenca: "Malária", bsl: "BSL-3" }
        ];

        function renderPatogenos() {
            const tbody = document.getElementById('tabelaPatogenos');
            tbody.innerHTML = patogenos.map(p => `
                <tr class="border-t border-white/10 hover:bg-white/5">
                    <td class="px-6 py-4 font-medium">${p.nome}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-orange-500/20 text-orange-400">GR${p.risco}</span>
                    </td>
                    <td class="px-6 py-4">${p.tipo}</td>
                    <td class="px-6 py-4">${p.doenca}</td>
                    <td class="px-6 py-4 text-center font-mono font-bold">${p.bsl}</td>
                </tr>
            `).join('');
        }

        document.getElementById('searchPat').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('#tabelaPatogenos tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        });

        window.onload = renderPatogenos;
    </script>
</body>
</html>
