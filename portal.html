<!doctype html>
<html lang="pt-br" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcquaSafe - Painel de Controle</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full bg-[#0a0f1a] text-white overflow-auto">
  <!-- Navbar com botão de pagamento -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-white/10 bg-[#0a0f1a]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
        <i data-lucide="droplets" class="w-5 h-5 text-white"></i>
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-300 to-blue-400 bg-clip-text text-transparent">AcquaSafe</span>
    </div>
    
    <div class="flex items-center gap-4">
      <a href="pagamento.html" class="flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 px-5 py-2.5 rounded-2xl font-semibold text-sm transition-all hover:scale-105">
        <i data-lucide="credit-card" class="w-4 h-4"></i>
        <span>Assinar Plano</span>
      </a>
      <button onclick="window.location.href='index.html'" class="px-4 py-2 text-sm text-red-400 hover:text-red-300">Sair</button>
    </div>
  </header>

  <!-- Restante do conteúdo do portal (chart, cards, etc.) -->
  <!-- Cole aqui o conteúdo principal que você já tinha -->

  <!-- <script src="script.js"></script> -->
</body>
</html>
