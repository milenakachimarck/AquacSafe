<!doctype html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcquaSafe - Tela Inicial</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="tela_inicial.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col items-center justify-center p-4">
        
        <div class="w-full max-w-md space-y-8">
            <div class="text-center">
                <h1 class="text-4xl font-bold text-white mb-2">AQUACSAFE</h1>
                <p class="text-white/60">Bem-vindo ao sistema de monitoramento</p>
            </div>

            <div class="glass-card rounded-2xl p-8">
                <div class="space-y-4">
                    <p class="text-center text-white/60 text-sm">
                        Não tem conta? 
                        <a href="#" class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors">Criar conta</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mt-16 w-full max-w-4xl">
            <div class="glass-card rounded-xl p-6 text-center feature-item">
                <div class="flex justify-center mb-3">
                    <div class="w-12 h-12 rounded-lg bg-cyan-500/20 flex items-center justify-center">
                        <i data-lucide="shield-check" class="w-6 h-6 text-cyan-400 feature-icon"></i>
                    </div>
                </div>
                <h3 class="font-semibold text-white mb-1">Seguro</h3>
                <p class="text-sm text-white/50">Criptografia de ponta a ponta</p>
            </div>

            <div class="glass-card rounded-xl p-6 text-center feature-item">
                <div class="flex justify-center mb-3">
                    <div class="w-12 h-12 rounded-lg bg-blue-500/20 flex items-center justify-center">
                        <i data-lucide="zap" class="w-6 h-6 text-blue-400 feature-icon"></i>
                    </div>
                </div>
                <h3 class="font-semibold text-white mb-1">Rápido</h3>
                <p class="text-sm text-white/50">Monitoramento em tempo real</p>
            </div>

            <div class="glass-card rounded-xl p-6 text-center feature-item">
                <div class="flex justify-center mb-3">
                    <div class="w-12 h-12 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                        <i data-lucide="activity" class="w-6 h-6 text-emerald-400 feature-icon"></i>
                    </div>
                </div>
                <h3 class="font-semibold text-white mb-1">Confiável</h3>
                <p class="text-sm text-white/50">Parâmetros certificados</p>
            </div>
        </div>

        <footer class="mt-auto py-8 text-center text-sm text-white/30">
            <p>© 2024 AcquaSafe. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();
    </script>
    <script src="login.js"></script>
</body>
</html>
