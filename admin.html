<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Controle de Água</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h1>Página de Administração</h1>
    </header>

    <main>
        <!-- Gerenciar Doenças -->
        <section id="doencas-section">
            <h2>Gerenciar Doenças</h2>
            <input type="text" id="novaDoencaInput" placeholder="Nome da doença">
            <button onclick="adicionarDoenca()">Adicionar</button>
            <ul id="listaDoencas">
                <!-- Doenças serão listadas aqui -->
            </ul>
        </section>

        <!-- Gerenciar Clientes -->
        <section id="clientes-section">
            <h2>Gerenciar Clientes</h2>
            <ul id="listaClientes">
                <!-- Clientes serão listados aqui -->
            </ul>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
