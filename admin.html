<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-bg">

    <header class="glass-card header-admin">
        <h1 class="gradient-text">Controle de Água - Administração</h1>

        <button class="btn-gradient" onclick="logout()">
            Sair
        </button>
    </header>

    <main class="dashboard">

        <section class="glass-card painel">
            <h2>Gerenciar Doenças</h2>

            <div class="add-box">
                <input
                    type="text"
                    id="novaDoenca"
                    class="input-field"
                    placeholder="Nova doença">

                <button class="btn-gradient" onclick="adicionarDoenca()">
                    Adicionar
                </button>
            </div>

            <ul id="listaDoencas"></ul>
        </section>

        <section class="glass-card painel">
            <h2>Clientes</h2>

            <ul id="listaClientes"></ul>
        </section>

    </main>

    <script src="admin.js"></script>
</body>
</html>
