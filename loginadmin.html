<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcquaSafe Monitor - Admin</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-[#0a1321] text-white flex items-center justify-center overflow-auto">

  <div class="w-full max-w-md px-6">
    <!-- Logo + Header -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/30">
        <i data-lucide="droplets" class="w-9 h-9 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">AcquaSafe Monitor</h1>
      <p class="text-slate-400 text-center mt-2">Sistema de monitoramento de qualidade da água para agricultores</p>
    </div>

    <!-- Botão Principal Verde -->
    <div class="mb-12">
      <button onclick="showLoginForm()" 
              class="w-full bg-emerald-500 hover:bg-emerald-600 transition-all duration-300 text-white font-semibold py-4 px-8 rounded-2xl flex items-center justify-center gap-3 shadow-xl shadow-emerald-500/30 text-lg">
        <i data-lucide="shield" class="w-6 h-6"></i>
        Acessar Painel Admin
      </button>
    </div>

    <!-- Formulário de Login (inicialmente escondido) -->
    <div id="login-form-container" class="hidden bg-[#13223a] border border-slate-700 rounded-3xl p-8">
      <h2 class="text-xl font-semibold text-center mb-6">Entre com suas credenciais</h2>
      
      <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm text-slate-400 mb-2">Usuário ou E-mail</label>
          <input type="text" id="admin-user" 
                 class="w-full px-5 py-3.5 bg-[#0f1c2e] border border-slate-600 rounded-2xl focus:border-emerald-500 focus:outline-none text-white"
                 placeholder="admin@exemplo.com" required>
        </div>
        
        <div>
          <label class="block text-sm text-slate-400 mb-2">Senha</label>
          <input type="password" id="admin-pass" 
                 class="w-full px-5 py-3.5 bg-[#0f1c2e] border border-slate-600 rounded-2xl focus:border-emerald-500 focus:outline-none text-white"
                 placeholder="••••••••" required>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 accent-emerald-500">
            <span class="text-slate-400">Lembrar-me</span>
          </label>
          <a href="#" class="text-emerald-400 hover:text-emerald-300">Esqueceu a senha?</a>
        </div>

        <button type="submit" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-semibold text-lg transition-all mt-4">
          Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-10">
      © 2026 AcquaSafe - Sistema Administrativo
    </p>
  </div>

  <script>
    lucide.createIcons();

    function showLoginForm() {
      document.getElementById('login-form-container').classList.remove('hidden');
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('admin-user').value;
      const pass = document.getElementById('admin-pass').value;

      if (user && pass) {
        alert("Login realizado com sucesso! (Simulação)");
        // Aqui você pode redirecionar para o dashboard real
        // window.location.href = "admin-dashboard.html";
      } else {
        alert("Preencha todos os campos");
      }
    }
  </script>
</body>
</html>
