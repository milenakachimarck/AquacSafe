<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaField Admin</title>
  
  <!-- Tailwind + Lucide -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  
  <!-- SDKs -->
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-[#0d1520] text-[#e0e8f0] overflow-auto">
  <div id="app" class="h-full w-full flex flex-col">
    <!-- Todo o conteúdo HTML está aqui -->
    <!-- Login Screen -->
    <div id="login-screen" class="h-full w-full flex items-center justify-center p-4 animate-[slideIn_0.5s_ease]">
      <div class="w-full max-w-md">
        <div class="glass rounded-2xl p-8 border border-[#1a2a3a]">
          <div class="flex justify-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#0ea5e9] to-[#06b6d4] flex items-center justify-center">
              <i data-lucide="droplets" class="w-7 h-7 text-white"></i>
            </div>
          </div>
          <h1 class="text-2xl font-bold text-white text-center mb-2">AquaField</h1>
          <p class="text-sm text-[#6b8299] text-center mb-8">Admin - Monitoramento de Água</p>
          
          <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label for="login-user" class="block text-xs text-[#6b8299] mb-2">Usuário</label>
              <input id="login-user" type="text" required class="w-full px-4 py-3 rounded-lg text-sm" placeholder="Digite seu usuário">
            </div>
            <div>
              <label for="login-pass" class="block text-xs text-[#6b8299] mb-2">Senha</label>
              <input id="login-pass" type="password" required class="w-full px-4 py-3 rounded-lg text-sm" placeholder="Digite sua senha">
            </div>
            <div id="login-error" class="hidden p-3 rounded-lg bg-[#ff4d4f22] border border-[#ff4d4f44] text-xs text-[#ff6b6b]"></div>
            
            <button type="submit" id="login-btn" class="w-full py-3 rounded-lg bg-gradient-to-r from-[#0ea5e9] to-[#06b6d4] hover:from-[#0284c7] hover:to-[#0891b2] text-white font-medium text-sm transition-all duration-300 flex items-center justify-center gap-2">
              <i data-lucide="log-in" class="w-4 h-4"></i> Entrar
            </button>
          </form>
          
          <p class="text-xs text-[#6b8299] text-center mt-6">Sistema restrito para administradores</p>
        </div>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-screen" class="hidden h-full w-full flex flex-col">
      <!-- Header, Main, Modal, etc. -->
      <!-- (Mantive todo o conteúdo original aqui) -->
      <!-- ... (todo o resto do HTML que estava no arquivo) ... -->
    </div>
  </div>

  <!-- JavaScript Externo -->
  <script src="script.js"></script>
</body>
</html>
