<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcquaSafe Monitor - Admin</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-[#0a1321] text-white flex items-center justify-center">

  <div class="w-full max-w-lg px-6 py-12">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between mb-12">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center">
          <i data-lucide="droplets" class="w-6 h-6 text-white"></i>
        </div>
        <span class="text-2xl font-bold">AcquaSafe Monitor</span>
      </div>
      <div class="flex items-center gap-2 text-emerald-400 text-sm">
        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
        Sistema Ativo
      </div>
    </div>

    <!-- Main Content -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold mb-3">AcquaSafe Monitor</h1>
      <p class="text-slate-400 text-lg">Sistema de monitoramento de qualidade da água para agricultores</p>
    </div>

    <!-- Botão Verde Grande -->
    <div class="mb-12">
      <button onclick="showLogin()" 
              class="w-full bg-emerald-500 hover:bg-emerald-600 transition-all py-4 px-8 rounded-2xl flex items-center justify-center gap-3 text-lg font-semibold shadow-lg shadow-emerald-500/30">
        <i data-lucide="shield" class="w-6 h-6"></i>
        Acessar Painel Admin
      </button>
    </div>

    <!-- Formulário de Login -->
    <div id="loginForm" class="hidden bg-[#13223a] border border-slate-700 rounded-3xl p-8">
      <h2 class="text-xl font-semibold mb-6 text-center">Entre com suas credenciais</h2>
      
      <form onsubmit="handleLogin(event)" class="space-y-6">
        <div>
          <label class="block text-sm text-slate-400 mb-2">Usuário ou E-mail</label>
          <input type="text" id="user" 
                 class="w-full px-5 py-4 bg-[#0f1c2e] border border-slate-600 rounded-2xl focus:border-emerald-500 focus:outline-none" 
                 placeholder="admin@exemplo.com" required>
        </div>

        <div>
          <label class="block text-sm text-slate-400 mb-2">Senha</label>
          <input type="password" id="pass" 
                 class="w-full px-5 py-4 bg-[#0f1c2e] border border-slate-600 rounded-2xl focus:border-emerald-500 focus:outline-none" 
                 placeholder="••••••••" required>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 accent-emerald-500">
            Lembrar-me
          </label>
          <a href="#" class="text-emerald-400 hover:text-emerald-300 text-sm">Esqueceu a senha?</a>
        </div>

        <button type="submit" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-semibold text-lg transition-all">
          Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-10">
      © 2026 AcquaSafe - Sistema Administrativo
    </p>
  </div>

  <script>
    lucide.createIcons();

    function showLogin() {
      document.getElementById('loginForm').classList.toggle('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      alert("✅ Login simulado com sucesso!\n\n(Em produção, redirecionaria para o dashboard)");
      // window.location.href = "admin-dashboard.html";
    }
  </script>
</body>
</html>
