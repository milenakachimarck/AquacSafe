<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcquaSafe Monitor - Admin</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full bg-[#0a1321] text-white flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md">
    
    <!-- Cabeçalho -->
    <div class="flex items-center gap-3 mb-10">
      <div class="w-11 h-11 bg-emerald-500 rounded-2xl flex items-center justify-center">
        <i data-lucide="droplets" class="w-7 h-7 text-white"></i>
      </div>
      <div>
        <span class="text-2xl font-bold">AcquaSafe Monitor</span>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold mb-2">Administração</h1>
      <p class="text-slate-400">Entre com suas credenciais</p>
    </div>

    <!-- Formulário -->
    <form onsubmit="handleLogin(event)" class="space-y-6">
      <div>
        <label class="block text-sm text-slate-400 mb-2">Usuário ou E-mail</label>
        <input type="text" value="admin@exemplo.com" 
               class="w-full px-5 py-4 bg-white text-gray-900 rounded-2xl border border-transparent focus:border-emerald-500 focus:outline-none text-base">
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-2">Senha</label>
        <input type="password" value="123456" 
               class="w-full px-5 py-4 bg-white text-gray-900 rounded-2xl border border-transparent focus:border-emerald-500 focus:outline-none text-base">
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer text-slate-400">
          <input type="checkbox" checked class="w-4 h-4 accent-emerald-500">
          Lembrar-me
        </label>
        <a href="#" class="text-emerald-400 hover:text-emerald-300">Esqueceu a senha?</a>
      </div>

      <button type="submit" 
              class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-semibold text-lg transition-all">
        Entrar
      </button>
    </form>

    <p class="text-center text-slate-500 text-xs mt-10">
      © 2026 AcquaSafe - Sistema Administrativo
    </p>
  </div>

  <script>
    lucide.createIcons();

    function handleLogin(e) {
      e.preventDefault();
      alert("Login realizado com sucesso! (Simulação)");
    }
  </script>
</body>
</html>
